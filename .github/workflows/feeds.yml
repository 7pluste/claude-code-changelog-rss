name: Rebuild Claude feeds

on:
  schedule:
    - cron: "17 * * * *"      # hourly; Claude Code ships several times a week
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rewrite feeds
        # Drop --plain if your reader renders HTML (Feedly, Inoreader, NetNewsWire…).
        # Keep it for Mattermost, Slack, Outlook, and email digests.
        run: |
          python rewrite_feeds.py --out docs \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
